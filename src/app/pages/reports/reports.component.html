<div class="reports-container">
  <div class="reports-header">
    <h1>Rapports et analyses</h1>
    <p>Analysez vos performances et générez des rapports</p>
  </div>

  <div class="report-controls">
    <div class="control-group">
      <label>Type de rapport</label>
      <nz-select [(ngModel)]="selectedReportType" nzSize="large">
        <nz-option nzValue="sales" nzLabel="Rapport des ventes"></nz-option>
        <nz-option nzValue="clients" nzLabel="Rapport des clients"></nz-option>
        <nz-option nzValue="financial" nzLabel="Rapport financier"></nz-option>
      </nz-select>
    </div>
    <div class="control-group">
      <label>Période</label>
      <nz-select [(ngModel)]="selectedPeriod" nzSize="large">
        <nz-option nzValue="week" nzLabel="Cette semaine"></nz-option>
        <nz-option nzValue="month" nzLabel="Ce mois"></nz-option>
        <nz-option nzValue="quarter" nzLabel="Ce trimestre"></nz-option>
        <nz-option nzValue="year" nzLabel="Cette année"></nz-option>
        <nz-option nzValue="custom" nzLabel="Période personnalisée"></nz-option>
      </nz-select>
    </div>
    <div class="control-group" *ngIf="selectedPeriod === 'custom'">
      <label>Période personnalisée</label>
      <nz-range-picker [(ngModel)]="selectedDateRange" nzSize="large"></nz-range-picker>
    </div>
    <div class="action-buttons">
      <button nz-button nzType="primary" nzSize="large" (click)="generateReport()">
        <span nz-icon nzType="bar-chart"></span>
        Générer le rapport
      </button>
    </div>
  </div>

  <!-- Statistiques générales dynamiques -->
  <div class="stats-section">
    <nz-row [nzGutter]="16">
      <nz-col [nzSpan]="6" [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-card>
          <nz-statistic
            nzTitle="Ventes totales"
            [nzValue]="salesReport?.chiffre_affaires"
            [nzValueStyle]="{ color: '#3f8600' }"
            nzSuffix="€">
          </nz-statistic>
        </nz-card>
      </nz-col>
      <nz-col [nzSpan]="6" [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-card>
          <nz-statistic
            nzTitle="Commandes"
            [nzValue]="salesReport?.total_ventes"
            [nzValueStyle]="{ color: '#1890ff' }">
          </nz-statistic>
        </nz-card>
      </nz-col>
      <nz-col [nzSpan]="6" [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-card>
          <nz-statistic
            nzTitle="Panier moyen"
            [nzValue]="salesReport?.chiffre_affaires && salesReport?.total_ventes ? (salesReport.chiffre_affaires / salesReport.total_ventes) : 0"
            [nzValueStyle]="{ color: '#722ed1' }"
            nzSuffix="€">
          </nz-statistic>
        </nz-card>
      </nz-col>
      <nz-col [nzSpan]="6" [nzXs]="24" [nzSm]="12" [nzMd]="6">
        <nz-card>
          <nz-statistic
            nzTitle="Croissance"
            [nzValue]="0"
            [nzValueStyle]="{ color: '#52c41a' }"
            nzSuffix="%">
          </nz-statistic>
        </nz-card>
      </nz-col>
    </nz-row>
  </div>

  <!-- Résumé financier dynamique -->
  <div class="financial-summary">
    <nz-card nzTitle="Résumé financier">
      <nz-row [nzGutter]="16">
        <nz-col [nzSpan]="8" [nzXs]="24" [nzSm]="12" [nzMd]="8">
          <nz-statistic
            nzTitle="Chiffre d'affaires"
            [nzValue]="financeReport?.total_recettes"
            [nzValueStyle]="{ color: '#3f8600' }"
            nzSuffix="€">
          </nz-statistic>
        </nz-col>
        <nz-col [nzSpan]="8" [nzXs]="24" [nzSm]="12" [nzMd]="8">
          <nz-statistic
            nzTitle="Dépenses"
            [nzValue]="financeReport?.total_depenses"
            [nzValueStyle]="{ color: '#cf1322' }"
            nzSuffix="€">
          </nz-statistic>
        </nz-col>
        <nz-col [nzSpan]="8" [nzXs]="24" [nzSm]="12" [nzMd]="8">
          <nz-statistic
            nzTitle="Bénéfice net"
            [nzValue]="financeReport?.solde"
            [nzValueStyle]="{ color: '#52c41a' }"
            nzSuffix="€">
          </nz-statistic>
        </nz-col>
      </nz-row>
      <div style="margin-top: 16px;">
        <nz-progress 
          [nzPercent]="0" 
          nzStatus="active"
          nzStrokeColor="#52c41a">
        </nz-progress>
        <p style="margin-top: 8px; color: #8c8c8c;">Marge bénéficiaire: 0%</p>
      </div>
    </nz-card>
  </div>

  <!-- Actions d'export -->
  <div class="export-actions">
    <h3>Exporter le rapport</h3>
    <p>Choisissez le format d'export pour votre rapport</p>
    <div class="action-buttons">
      <button nz-button nzType="default" nzSize="large" (click)="exportReport('pdf')">
        <span nz-icon nzType="file-pdf"></span>
        PDF
      </button>
      <button nz-button nzType="default" nzSize="large" (click)="exportReport('excel')">
        <span nz-icon nzType="file-excel"></span>
        Excel
      </button>
      <button nz-button nzType="default" nzSize="large" (click)="exportReport('csv')">
        <span nz-icon nzType="file-text"></span>
        CSV
      </button>
    </div>
  </div>
</div>
