<div class="login-container">
  <div class="login-background">
    <div class="login-card">
      <div class="login-logo" style="text-align:center; margin-bottom: 16px;">
        <img src="/assets/logo.png" alt="Logo Gestion Pro" style="height:60px; width:auto;" />
      </div>
      <div class="login-header">
        <h1>Gestion Pro</h1>
        <p>Connectez-vous à votre compte</p>
      </div>

      <form nz-form [formGroup]="loginForm" (ngSubmit)="submitForm()" class="login-form">
        <nz-form-item>
          <nz-form-label [nzSpan]="24" nzRequired>Email</nz-form-label>
          <nz-form-control nzErrorTip="Veuillez saisir un email valide">
            <nz-input-group nzPrefixIcon="mail">
              <input type="email" nz-input formControlName="email" placeholder="Votre email" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <nz-form-item>
          <nz-form-label [nzSpan]="24" nzRequired>Mot de passe</nz-form-label>
          <nz-form-control nzErrorTip="Le mot de passe doit contenir au moins 6 caractères">
            <nz-input-group nzPrefixIcon="lock">
              <input type="password" nz-input formControlName="password" placeholder="Votre mot de passe" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <div class="form-actions">
          <label nz-checkbox formControlName="remember">
            Se souvenir de moi
          </label>
          <a routerLink="/auth/forgot-password" class="forgot-password">
            Mot de passe oublié ?
          </a>
        </div>

        <button nz-button nzType="primary" nzBlock [nzLoading]="isLoading" type="submit">
          Se connecter
        </button>
      </form>

      <nz-divider nzText="ou">ou</nz-divider>

      <div class="social-login">
        <button nz-button nzBlock nzSize="large" class="google-btn" (click)="loginWithGoogle()">
          <span nz-icon nzType="google" nzTheme="outline"></span>
          Continuer avec Google
        </button>
        
        <button nz-button nzBlock nzSize="large" class="facebook-btn" (click)="loginWithFacebook()">
          <span nz-icon nzType="facebook" nzTheme="outline"></span>
          Continuer avec Facebook
        </button>
      </div>

      <div class="register-link">
        <p>
          Pas encore de compte ? 
          <a routerLink="/auth/register">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</div>
