<div class="forgot-password-container">
  <div class="forgot-password-background">
    <div class="forgot-password-card">
      <div class="forgot-password-header">
        <h1>Mot de passe oublié</h1>
        <p>Entrez votre email pour recevoir un lien de récupération</p>
      </div>

      <form nz-form [formGroup]="forgotPasswordForm" (ngSubmit)="submitForm()" class="forgot-password-form">
        <nz-form-item>
          <nz-form-label [nzSpan]="24" nzRequired>Email</nz-form-label>
          <nz-form-control nzErrorTip="Veuillez saisir un email valide">
            <nz-input-group nzPrefixIcon="mail">
              <input type="email" nz-input formControlName="email" placeholder="Votre email" />
            </nz-input-group>
          </nz-form-control>
        </nz-form-item>

        <button nz-button nzType="primary" nzBlock [nzLoading]="isLoading" type="submit">
          Envoyer le lien de récupération
        </button>
      </form>

      <div class="back-to-login">
        <a routerLink="/auth/login">
          <span nz-icon nzType="arrow-left"></span>
          Retour à la connexion
        </a>
      </div>
    </div>
  </div>
</div>
